[project]
name = "schedulize-backend"
version = "0.1.0"
description = "Schedulize backend API for conference recommendations."
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pydantic>=2.9.0",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]
